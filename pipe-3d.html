<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pipe A–B–C 3D Model</title></head><body>
<style>
/* Layout: one full-height drafting sheet; thin toolbar on top, canvas fills the rest. */
:root{
  --paper:#fbfcfd; --ink:#1d2731; --muted:#5d6b78; --rule:#d5dde4;
  --btn:#eef3f7; --btn-on:#2f6f9f; --btn-on-ink:#ffffff;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui)}
.pv{display:flex;flex-direction:column;height:100%;min-height:420px;box-sizing:border-box}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--rule)}
.pv-title{font-weight:600;font-size:15px;margin-right:auto;white-space:nowrap}
.pv-home{color:var(--btn-on);text-decoration:none;font-weight:500;margin-right:10px;padding-right:10px;border-right:1px solid var(--rule)}
.pv-home:hover{text-decoration:underline}
.pv-title span{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.pv button{font:500 13px var(--ui);color:var(--ink);background:var(--btn);border:1px solid var(--rule);
  border-radius:6px;padding:6px 11px;cursor:pointer}
.pv button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);border-color:var(--btn-on)}
.pv-row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--rule)}
.pv-lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.pv-grp{display:inline-flex;align-items:center;gap:6px;padding-right:10px;margin-right:2px;border-right:1px solid var(--rule)}
.pv-grp:last-child{border-right:0}
.pv button.hl{border-color:var(--c);color:var(--c);background:var(--paper);font-weight:600}
.pv button.hl[aria-pressed="true"]{background:var(--c);color:#fff}
.pv button:disabled{opacity:.45;cursor:not-allowed}
.pv-mstat{font-size:12px;color:var(--muted)}
.pv-card{position:absolute;left:16px;top:12px;max-width:min(430px,calc(100% - 32px));box-sizing:border-box;
  background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--mc,#b0680a);border-radius:6px;
  padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 2px 10px rgba(30,45,60,.08)}
.pv-card b{font-size:14px}
.pv-card .eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:15px;font-variant-numeric:tabular-nums;margin:3px 0}
.pv-card .note{color:var(--muted);font-size:12px}
.pv button:focus-visible{outline:2px solid var(--btn-on);outline-offset:2px}
.pv-stage{position:relative;flex:1;min-height:0}
.pv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.pv canvas.drag{cursor:grabbing}
.pv-hint{position:absolute;left:16px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
</style>
<div class="pv">
  <div class="pv-bar">
    <div class="pv-title"><a class="pv-home" href="./">← MANE 1010</a>Pipe A–B–C <span>· F = 80 N at C</span></div>
    <button id="pv-iso" type="button">Textbook view</button>
    <button id="pv-top" type="button">Top (x–y)</button>
    <button id="pv-side" type="button">Side (y–z)</button>
    <button id="pv-dims" type="button" aria-pressed="true">Dimensions</button>
    <button id="pv-labels" type="button" aria-pressed="true">Labels</button>
  </div>
  <div class="pv-row2">
    <span class="pv-grp"><span class="pv-lbl">Force components</span>

    <button id="pv-Fy" class="hl" style="--c:#1f8a4c" type="button" aria-pressed="false">F<sub>y</sub></button>
    <button id="pv-Fz" class="hl" style="--c:#2563c9" type="button" aria-pressed="false">F<sub>z</sub></button></span>

    <button id="pv-ax" class="hl" style="--c:#c8323c" type="button" aria-pressed="false">x</button>

    <button id="pv-az" class="hl" style="--c:#2563c9" type="button" aria-pressed="false">z</button></span>
    <span class="pv-grp"><button id="pv-all" type="button">All on</button>
    <button id="pv-none" type="button">Clear</button></span>
    <span class="pv-grp"><span class="pv-lbl">Moment</span>
    <button id="pv-play" type="button" disabled>▶ Play</button>
    <button id="pv-reset" type="button" disabled>Reset</button>
    <span id="pv-mstat" class="pv-mstat">Turn on one force component and one axis</span></span>
  </div>

    <div id="pv-card" class="pv-card" hidden></div>
    <div class="pv-hint">Drag to rotate · scroll or pinch to zoom · shift-drag or two fingers to pan · double-click to reset</div>
  </div>
</div>

    if(it.tri){
      const c=`rgba(${it.col[0]},${it.col[1]},${it.col[2]},${it.a})`;
      ctx.beginPath(); ctx.moveTo(it.tri[0][0],it.tri[0][1]); ctx.lineTo(it.tri[1][0],it.tri[1][1]); ctx.lineTo(it.tri[2][0],it.tri[2][1]); ctx.closePath();
      ctx.fillStyle=c; ctx.fill();
      if(it.a>=0.99){ctx.strokeStyle=c; ctx.lineWidth=0.6; ctx.stroke();}
    } else {
      if(it.d && it.ph%2===1) continue;           // dashed: skip alternate pieces
      ctx.strokeStyle=it.c; ctx.lineWidth=Math.max(1,it.w*0.6);
      ctx.beginPath(); ctx.moveTo(it.seg[0][0],it.seg[0][1]); ctx.lineTo(it.seg[1][0],it.seg[1][1]); ctx.stroke();
    }
  }
  // arrowheads of the moment glyph
  for(const h of heads){ctx.fillStyle=MCOL; ctx.beginPath(); ctx.moveTo(h[0][0],h[0][1]); ctx.lineTo(h[1][0],h[1][1]); ctx.lineTo(h[2][0],h[2][1]); ctx.closePath(); ctx.fill();}
  // labels always on top
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const l of S.labels){
    if(!keep(l)) continue;
    const s=P(X(l,l.p));
    const big = /^[A-Cxyz]$/.test(l.s);
    ctx.font=`${big?'italic ':''}${big?600:500} ${Math.round(l.z*(big?1.05:0.95))}px ${big?'Georgia,"Times New Roman",serif':'system-ui,sans-serif'}`;
    ctx.lineWidth=4; ctx.strokeStyle='rgba(251,252,253,0.9)'; ctx.strokeText(l.s,s[0],s[1]);
    ctx.fillStyle=l.c; ctx.fillText(l.s,s[0],s[1]);
  }
}

// ---- moment animation
const META=S.meta, AX='xyz', MCOL='#b0680a';
let anim={on:false,i:0,j:1,th:0,M:0,raf:0};
function rotFn(j,th){const c=Math.cos(th), s=Math.sin(th), a=(j+1)%3, b=(j+2)%3;
  return p=>{const q=p.slice(); q[a]=p[a]*c-p[b]*s; q[b]=p[a]*s+p[b]*c; return q;};}
function screenHead(P, from, to, size){         // filled arrowhead at `to`, pointing from `from`
  const a=P(from), b=P(to); let dx=b[0]-a[0], dy=b[1]-a[1]; const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
  return [[b[0]+dx*size*0.6,b[1]+dy*size*0.6],[b[0]-dx*size*0.6-dy*size*0.45,b[1]-dy*size*0.6+dx*size*0.45],
          [b[0]-dx*size*0.6+dy*size*0.45,b[1]-dy*size*0.6-dx*size*0.45]];}
function momentGlyph(P, items, heads){
  const j=anim.j, sg=Math.sign(anim.M), a=(j+1)%3, b=(j+2)%3;
  const ej=[0,0,0]; ej[j]=1; const o=[0,0,0]; o[j]={0:330,1:200,2:170}[j];
  const rad=105, span=sg*1.65*Math.PI, n=48, pts=[];
  for(let k=0;k<=n;k++){const t=span*k/n+0.25*Math.PI, q=o.slice(); q[a]+=rad*Math.cos(t); q[b]+=rad*Math.sin(t); pts.push(q);}
  for(let k=0;k<n-1;k++){const A=P(pts[k]), B=P(pts[k+1]); items.push({z:(A[2]+B[2])/2+2, seg:[A,B], c:MCOL, w:6, d:0, ph:0});}
  heads.push(screenHead(P, pts[n-2], pts[n], 18));
  // moment vector along ±axis (double-headed, statics convention)
  const tip=o.map((v,m)=>v+sg*ej[m]*190), mid=o.map((v,m)=>v+sg*ej[m]*160);
  const A=P(o), B=P(mid); items.push({z:(A[2]+B[2])/2+2, seg:[A,B], c:MCOL, w:6, d:0, ph:0});
  heads.push(screenHead(P, o, mid, 16)); heads.push(screenHead(P, o, tip, 16));
}
const fmt=(v,d)=>(v<0?'−':'')+Math.abs(v).toFixed(d);
function momentInfo(){
  const i=anim.i, j=anim.j, F=META.F, r=META.C.map(v=>v/1000);
  const fi=`F<sub>${AX[i]}</sub>`, aj=`${AX[j]}`;
  if(i===j) return {M:0, html:`<b>${fi} about the ${aj}-axis</b><div class="eq">M<sub>${aj}</sub> = 0</div><div class="note">${fi} is parallel to the ${aj}-axis, so it cannot turn the pipe about it.</div>`};
  const k=3-i-j, ek=[0,0,0], ei=[0,0,0], ej=[0,0,0]; ek[k]=1; ei[i]=1; ej[j]=1;
  const sgn=(ek[1]*ei[2]-ek[2]*ei[1])*ej[0]+(ek[2]*ei[0]-ek[0]*ei[2])*ej[1]+(ek[0]*ei[1]-ek[1]*ei[0])*ej[2];
  const M=sgn*r[k]*F[i], s=sgn<0?'−':'';
  const sense = M>0?`+${aj}`:`−${aj}`;
  return {M, html:`<b>Moment of ${fi} about the ${aj}-axis</b>
    <div class="eq">M<sub>${aj}</sub> = ${s}r<sub>${AX[k]}</sub>F<sub>${AX[i]}</sub> = ${s}(${fmt(r[k],3)} m)(${fmt(F[i],2)} N) = <b>${fmt(M,2)} N·m</b></div>
    <div class="note">${M>0?'Positive':'Negative'}: the pipe turns about ${sense} (right-hand rule, thumb along ${sense}). Rotation angle is exaggerated for illustration.</div>`};
}
const btnPlay=document.getElementById('pv-play'), btnReset=document.getElementById('pv-reset'),
      mstat=document.getElementById('pv-mstat'), card=document.getElementById('pv-card');
function selection(){const f=['Fx','Fy','Fz'].filter(k=>show[k]), a=['ax','ay','az'].filter(k=>show[k]);
  return (f.length===1&&a.length===1)?{i:'xyz'.indexOf(f[0][1]), j:'xyz'.indexOf(a[0][1])}:null;}
function stopAnim(){cancelAnimationFrame(anim.raf); anim.on=false; anim.th=0; card.hidden=true; btnReset.disabled=true; btnPlay.textContent='▶ Play';}
function updateMomentUI(){const sel=selection(); btnPlay.disabled=!sel;
  mstat.textContent = sel ? `F${AX[sel.i]} about the ${AX[sel.j]}-axis` : 'Turn on one force component and one axis';}
btnPlay.onclick=()=>{const sel=selection(); if(!sel) return;
  cancelAnimationFrame(anim.raf); anim.on=true; anim.i=sel.i; anim.j=sel.j; anim.th=0;
  const info=momentInfo(); anim.M=info.M; card.innerHTML=info.html; card.style.setProperty('--mc', MCOL); card.hidden=false; btnReset.disabled=false;
  if(info.M===0){draw(); return;}
  const target=Math.sign(info.M)*35*Math.PI/180, dur=2600, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, t0=performance.now();
  const step=now=>{let u=Math.min(1,(now-t0)/dur); if(reduce) u=1; const ease=u*u*(3-2*u); anim.th=target*ease; draw();
    if(u<1) anim.raf=requestAnimationFrame(step); else btnPlay.textContent='↻ Replay';};
  anim.raf=requestAnimationFrame(step);};
btnReset.onclick=()=>{stopAnim(); draw();};

// ---- interaction
const ptrs=new Map(); let last=null, pinch=null;
cv.addEventListener('pointerdown',ev=>{cv.setPointerCapture(ev.pointerId); ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]); cv.classList.add('drag');
  last={x:ev.clientX,y:ev.clientY,pan:ev.shiftKey||ev.button===2};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]), m:[(a[0]+b[0])/2,(a[1]+b[1])/2], zoom:cam.zoom};}});
cv.addEventListener('pointermove',ev=>{
  if(!ptrs.has(ev.pointerId)) return;
  ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]), m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    cam.zoom=Math.min(8,Math.max(0.3,pinch.zoom*d/pinch.d)); cam.pan[0]+=m[0]-pinch.m[0]; cam.pan[1]+=m[1]-pinch.m[1]; pinch.m=m; draw(); return;}
  if(!last) return;
  const dx=ev.clientX-last.x, dy=ev.clientY-last.y; last.x=ev.clientX; last.y=ev.clientY;
  if(last.pan||ev.shiftKey){cam.pan[0]+=dx; cam.pan[1]+=dy;}
  else{cam.az-=dx*0.008; cam.el=Math.max(-1.55,Math.min(1.55,cam.el+dy*0.008));}
  draw();});
const up=ev=>{ptrs.delete(ev.pointerId); if(ptrs.size<2) pinch=null; if(!ptrs.size){last=null; cv.classList.remove('drag');}};
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',ev=>ev.preventDefault());
cv.addEventListener('wheel',ev=>{ev.preventDefault(); cam.zoom=Math.min(8,Math.max(0.3,cam.zoom*Math.exp(-ev.deltaY*0.0015))); draw();},{passive:false});
cv.addEventListener('dblclick',()=>resetView(ISO.az,ISO.el));
document.getElementById('pv-iso').onclick=()=>resetView(ISO.az,ISO.el);
document.getElementById('pv-top').onclick=()=>resetView(0,Math.PI/2-1e-4);
document.getElementById('pv-side').onclick=()=>resetView(0,0);
const keys=['dims','labels','Fx','Fy','Fz','ax','ay','az'], hl=keys.slice(2);
const sync=()=>{for(const k of keys) document.getElementById('pv-'+k).setAttribute('aria-pressed',String(show[k]));
  if(anim.on){const sel=selection(); if(!sel||sel.i!==anim.i||sel.j!==anim.j) stopAnim();}
  updateMomentUI(); draw();};
for(const k of keys) document.getElementById('pv-'+k).onclick=()=>{show[k]=!show[k]; sync();};
document.getElementById('pv-all').onclick=()=>{hl.forEach(k=>show[k]=true); sync();};
document.getElementById('pv-none').onclick=()=>{hl.forEach(k=>show[k]=false); sync();};
updateMomentUI();
new ResizeObserver(resize).observe(cv); resize();
})();
</script>
</body></html>
